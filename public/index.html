<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIS Work India — Sales Assistant</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }
    #header { background: #1a1a2e; color: #fff; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    #header .brand { display: flex; align-items: center; gap: 10px; }
    #header .logo { width: 36px; height: 36px; border-radius: 50%; background: #4a90d9; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    #header .title { font-size: 15px; font-weight: 700; }
    #header .subtitle { font-size: 11px; opacity: 0.7; }
    #header .right { display: flex; align-items: center; gap: 14px; }
    #header .online { font-size: 11px; color: #4caf50; }
    #header .online::before { content: "● "; }
    #clearBtn { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    #clearBtn:hover { background: rgba(255,255,255,0.1); }
    #chat { flex: 1; overflow-y: auto; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; }
    .bubble-wrap { display: flex; align-items: flex-start; gap: 8px; }
    .bubble-wrap.user { flex-direction: row-reverse; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0; margin-top: 2px; }
    .avatar.bot { background: #1a1a2e; color: #fff; }
    .avatar.user { background: #4a90d9; color: #fff; }
    .bubble { max-width: 100%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .bubble.bot { background: #fff; color: #222; border-top-left-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .bubble.user { background: #1a73e8; color: #fff; border-top-right-radius: 2px; }
    .bubble.html-content { max-width: 100%; padding: 10px; background: #fff; overflow-x: auto; box-shadow: 0 1px 6px rgba(0,0,0,0.12); border-radius: 10px; }
    .bubble table, .bubble.html-content table { border-collapse: collapse !important; font-size: 12px !important; font-family: Arial !important; }
    .bubble table th, .bubble.html-content table th { padding: 6px 10px !important; border: 1px solid #444 !important; background: #1a1a2e !important; color: #fff !important; font-size: 12px !important; white-space: nowrap !important; text-align: left !important; }
    .bubble table td, .bubble.html-content table td { padding: 5px 8px !important; border: 1px solid #ddd !important; font-size: 12px !important; white-space: nowrap !important; }
    .bubble table tbody tr:nth-child(even) td { background: #f9f9f9 !important; }
    .bubble table tbody tr:nth-child(odd) td { background: #fff !important; }
    .bubble table tbody tr:hover td { background: #eef4ff !important; }
    .bubble table td a { color: #1a73e8; text-decoration: none; font-size: 11px; }
    .bubble table td a:hover { text-decoration: underline; }
    .download-bar { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .dl-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.15s; }
    .dl-btn.pdf { background: #e53935; color: #fff; }
    .dl-btn.pdf:hover { background: #c62828; }
    .dl-btn.img { background: #1a73e8; color: #fff; }
    .dl-btn.img:hover { background: #1558b0; }
    .dl-btn.csv { background: #2e7d32; color: #fff; }
    .dl-btn.csv:hover { background: #1b5e20; }
    .chart-wrap { margin-top: 12px; background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .chart-title { font-size: 13px; font-weight: bold; color: #1a1a2e; margin-bottom: 8px; }
    .suggestions-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .suggestion-btn { padding: 5px 12px; border: 1.5px solid #1a73e8; background: #fff; color: #1a73e8; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.15s; }
    .suggestion-btn:hover { background: #1a73e8; color: #fff; }
    .typing { display: flex; align-items: center; gap: 4px; padding: 10px 13px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #999; display: inline-block; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    #inputBar { background: #fff; border-top: 1px solid #ddd; padding: 10px 14px; display: flex; gap: 8px; flex-shrink: 0; }
    #msgInput { flex: 1; padding: 9px 14px; border: 1.5px solid #ddd; border-radius: 24px; font-size: 13px; outline: none; transition: border-color 0.2s; }
    #msgInput:focus { border-color: #1a73e8; }
    #sendBtn { width: 40px; height: 40px; border-radius: 50%; background: #1a73e8; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
    #sendBtn:hover { background: #1558b0; }
    #sendBtn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>
<div id="header">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="title">MIS Work India</div>
      <div class="subtitle">Sales Assistant</div>
    </div>
  </div>
  <div class="right">
    <button id="clearBtn" onclick="clearChat()">Clear chat</button>
    <span class="online">Online</span>
  </div>
</div>
<div id="chat"></div>
<div id="inputBar">
  <input id="msgInput" type="text" placeholder="Ask about invoices, ledger, payments, expenses..." />
  <button id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>
<script>
  let SESSION_ID = sessionStorage.getItem("mis_session_id");
  if (!SESSION_ID) {
    SESSION_ID = "s_" + Math.random().toString(36).slice(2);
    sessionStorage.setItem("mis_session_id", SESSION_ID);
  }
  let history = [];
  let pendingExactName = null;
  let chartCounter = 0;

  function fixHTML(html) {
    html = html.replace(/\bundefined\b/gi, "-").replace(/\bnull\b/gi, "-").replace(/\bEMPTY\b/g, "-");
    const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    html = html.replace(/\b(20\d{2})-(0[1-9]|1[0-2])-(\d{2})\b/g, (_, y, mo, d) => d + "-" + M[parseInt(mo)-1] + "-" + y.slice(2));
    html = html.replace(/\b(20\d{2})-(0[1-9]|1[0-2])\b/g, (_, y, mo) => M[parseInt(mo)-1] + "-" + y.slice(2));
    html = html.replace(/^(\s*<br\s*\/?>\s*)+/gi, "").replace(/(\s*<br\s*\/?>\s*)+$/gi, "").trim();
    return html;
  }

  function makeLinksClickable(container) {
    container.querySelectorAll("td").forEach(td => {
      const text = td.textContent.trim();
      if ((text.startsWith("http://") || text.startsWith("https://")) && !td.querySelector("a")) {
        td.innerHTML = `<a href="${text}" target="_blank" style="color:#1a73e8;text-decoration:none;font-size:11px">📄 View PDF</a>`;
      }
    });
  }

  // ── CHART BUILDER — uses server hint (chartMeta) ──────────────────────────
  function tryBuildChart(container, chartMeta) {
    const tables = container.querySelectorAll("table");
    if (!tables.length) return;

    const table = tables[0];
    const headers = [...table.querySelectorAll("th")].map(th => th.textContent.trim());
    const rows = [...table.querySelectorAll("tbody tr")].filter(r => {
      const first = r.cells[0]?.textContent?.trim().toLowerCase();
      return first && first !== "grand total" && first !== "total";
    });

    if (rows.length < 2 || rows.length > 100) return;

    const labelCol = 0;
    const valCols = [];
    headers.forEach((h, i) => {
      if (i > 0 && /total|amount|sales|revenue|expense|price|ratio|pending|balance|salary|cost|profit|loss/i.test(h)) {
        valCols.push(i);
      }
    });
    if (!valCols.length) return;

    const totalIdx = headers.findIndex(h => /^total$/i.test(h.trim()));
    if (totalIdx > -1 && valCols.length > 1) {
      const filtered = valCols.filter(i => i !== totalIdx);
      if (filtered.length) { valCols.length = 0; filtered.forEach(i => valCols.push(i)); }
    }

    const sampleRow = rows[0];
    const hasRealNumbers = valCols.some(ci => {
      const txt = sampleRow?.cells[ci]?.textContent?.replace(/[Rs.\s,₹]/g, "") || "";
      return txt.length > 0 && txt.length < 15 && !isNaN(parseFloat(txt));
    });
    if (!hasRealNumbers) return;

    const labels = rows.map(r => r.cells[labelCol]?.textContent?.trim() || "");
    const parseNum = t => parseFloat((t || "").replace(/[Rs.,\s₹]/g, "")) || 0;

    // Use server hint if available
    const serverType = chartMeta?.chartType;
    const serverTitle = chartMeta?.title;

    // Detect time series only if ALL labels are months
    const isTimeSeries = labels.every(l => /jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|\d{4}-\d{2}/i.test(l));
    const isSingle = valCols.length === 1;
    const isAging = headers.some(h => /\d+.*day|day.*\d+/i.test(h));
    const isBucket = valCols.length >= 2 && !isTimeSeries;

    const COLORS = ["#1a73e8","#e53935","#2e7d32","#f57c00","#7b1fa2","#00838f","#c62828","#558b2f","#ad1457","#1565c0","#4527a0","#00695c"];
    const chartId = "chart_" + (++chartCounter);
    const wrap = document.createElement("div");
    wrap.className = "chart-wrap";

    let chartType, datasets, chartTitle;

    if (serverType === "pie" || serverType === "doughnut") {
      // Server says pie/doughnut
      chartType = serverType;
      chartTitle = "🥧 " + (serverTitle || "Category Breakdown");
      datasets = [{
        data: rows.map(r => parseNum(r.cells[valCols[0]]?.textContent)),
        backgroundColor: COLORS.slice(0, rows.length),
        borderWidth: 2
      }];
    } else if (serverType === "line" || (!serverType && isTimeSeries && isSingle)) {
      // Server says line OR auto-detected time series
      chartType = "line";
      chartTitle = "📈 " + (serverTitle || "Trend Chart");
      datasets = valCols.map((ci, idx) => ({
        label: headers[ci],
        data: rows.map(r => parseNum(r.cells[ci]?.textContent)),
        borderColor: COLORS[idx],
        backgroundColor: COLORS[idx] + "22",
        tension: 0.3, fill: true, pointRadius: 4, borderWidth: 2
      }));
    } else if (isTimeSeries && !isSingle) {
      // Multiple columns + time series = grouped bar
      chartType = "bar";
      chartTitle = "📊 " + (serverTitle || "Monthly Comparison");
      datasets = valCols.map((ci, idx) => ({
        label: headers[ci],
        data: rows.map(r => parseNum(r.cells[ci]?.textContent)),
        backgroundColor: COLORS[idx] + "cc",
        borderColor: COLORS[idx],
        borderWidth: 1
      }));
    } else if (isAging || isBucket) {
      chartType = "bar";
      chartTitle = "📊 " + (serverTitle || "Comparison Chart");
      datasets = valCols.slice(0, 6).map((ci, idx) => ({
        label: headers[ci],
        data: rows.map(r => parseNum(r.cells[ci]?.textContent)),
        backgroundColor: COLORS[idx] + "cc",
        borderColor: COLORS[idx],
        borderWidth: 1,
        stack: "stack"
      }));
    } else {
      // Default: bar chart
      chartType = "bar";
      chartTitle = "📊 " + (serverTitle || "Bar Chart");
      datasets = isSingle ? [{
        label: headers[valCols[0]] || "Amount",
        data: rows.map(r => parseNum(r.cells[valCols[0]]?.textContent)),
        backgroundColor: rows.map((_, i) => COLORS[i % COLORS.length] + "cc"),
        borderColor: rows.map((_, i) => COLORS[i % COLORS.length]),
        borderWidth: 1
      }] : valCols.slice(0, 4).map((ci, idx) => ({
        label: headers[ci],
        data: rows.map(r => parseNum(r.cells[ci]?.textContent)),
        backgroundColor: COLORS[idx] + "cc",
        borderColor: COLORS[idx],
        borderWidth: 1
      }));
    }

    wrap.innerHTML = `<div class="chart-title">${chartTitle}</div><canvas id="${chartId}" style="max-height:320px"></canvas>`;
    container.appendChild(wrap);

    setTimeout(() => {
      const ctx = document.getElementById(chartId);
      if (!ctx) return;
      new Chart(ctx, {
        type: chartType,
        data: { labels, datasets },
        options: {
          responsive: true,
          plugins: {
            legend: { position: chartType === "pie" || chartType === "doughnut" ? "right" : "top", labels: { font: { size: 11 } } },
            tooltip: {
              callbacks: {
                label: ctx => {
                  const v = ctx.parsed.y !== undefined ? ctx.parsed.y : ctx.parsed;
                  return " Rs. " + (v || 0).toLocaleString("en-IN");
                }
              }
            }
          },
          scales: chartType !== "pie" && chartType !== "doughnut" ? {
            y: { ticks: { callback: v => "Rs." + (v >= 100000 ? (v/100000).toFixed(1)+"L" : v >= 1000 ? (v/1000).toFixed(0)+"K" : v), font: { size: 10 } } },
            x: { ticks: { font: { size: 10 }, maxRotation: 45 } }
          } : {}
        }
      });
    }, 100);
  }

  function tableToCSV(table) {
    const rows = [];
    table.querySelectorAll("tr").forEach(r => {
      const cells = [...r.querySelectorAll("th,td")].map(c => '"' + c.textContent.trim().replace(/"/g, '""') + '"');
      rows.push(cells.join(","));
    });
    return rows.join("\n");
  }

  function addDownloadButtons(bubble) {
    const bar = document.createElement("div");
    bar.className = "download-bar";

    const pdfBtn = document.createElement("button");
    pdfBtn.className = "dl-btn pdf";
    pdfBtn.innerHTML = "⬇ Download PDF";
    pdfBtn.onclick = async () => {
      pdfBtn.textContent = "Generating...";
      try {
        const { jsPDF } = window.jspdf;
        const canvas = await html2canvas(bubble, { scale: 2, useCORS: true, backgroundColor: "#fff" });
        const imgData = canvas.toDataURL("image/png");
        const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? "l" : "p", unit: "px", format: [canvas.width/2, canvas.height/2] });
        pdf.addImage(imgData, "PNG", 0, 0, canvas.width/2, canvas.height/2);
        pdf.save("MIS_Report_" + new Date().toISOString().split("T")[0] + ".pdf");
      } catch(e) { alert("PDF error: " + e.message); }
      pdfBtn.innerHTML = "⬇ Download PDF";
    };

    const imgBtn = document.createElement("button");
    imgBtn.className = "dl-btn img";
    imgBtn.innerHTML = "🖼 Save as Image";
    imgBtn.onclick = async () => {
      imgBtn.textContent = "Saving...";
      try {
        const canvas = await html2canvas(bubble, { scale: 2, useCORS: true, backgroundColor: "#fff" });
        const link = document.createElement("a");
        link.download = "MIS_Report_" + new Date().toISOString().split("T")[0] + ".png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch(e) { alert("Image error: " + e.message); }
      imgBtn.innerHTML = "🖼 Save as Image";
    };

    bar.appendChild(pdfBtn);
    bar.appendChild(imgBtn);

    const tables = bubble.querySelectorAll("table");
    if (tables.length) {
      const csvBtn = document.createElement("button");
      csvBtn.className = "dl-btn csv";
      csvBtn.innerHTML = "📥 Export CSV";
      csvBtn.onclick = () => {
        const csv = tableToCSV(tables[0]);
        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.download = "MIS_Data_" + new Date().toISOString().split("T")[0] + ".csv";
        link.href = URL.createObjectURL(blob);
        link.click();
      };
      bar.appendChild(csvBtn);
    }
    bubble.appendChild(bar);
  }

  function addMessage(role, content, type = "text", options = [], chartMeta = null) {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap " + (role === "user" ? "user" : "bot");

    const av = document.createElement("div");
    av.className = "avatar " + (role === "user" ? "user" : "bot");
    av.textContent = role === "user" ? "U" : "M";

    const bubble = document.createElement("div");

    if (type === "html") {
      bubble.className = "bubble html-content";
      bubble.innerHTML = fixHTML(content);
      setTimeout(() => {
        makeLinksClickable(bubble);
        tryBuildChart(bubble, chartMeta);
        addDownloadButtons(bubble);
      }, 200);
    } else if (type === "suggestions") {
      bubble.className = "bubble bot";
      bubble.innerHTML = `<div style="margin-bottom:6px;font-weight:500">${content}</div>`;
      const sw = document.createElement("div");
      sw.className = "suggestions-wrap";
      (options || []).forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "suggestion-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          const sysOpts = ["Show all sales","Show all expenses","Show pending payments","Show ledger"];
          if (sysOpts.includes(opt)) {
            sendMessage(opt);
          } else {
            const lastUser = [...document.querySelectorAll('.bubble.user')].pop();
            const isInvoice = lastUser && /invoice|bill/i.test(lastUser.textContent);
            if (isInvoice) {
              sendMessage("give me invoice of " + opt);
            } else {
              pendingExactName = opt;
              sendMessage(opt + " ledger");
            }
          }
        };
        sw.appendChild(btn);
      });
      bubble.appendChild(sw);
    } else {
      bubble.className = "bubble " + (role === "user" ? "user" : "bot");
      const hasHTML = /<table|<div|<tr|<td|<th/i.test(content);
      if (hasHTML && role === "assistant") {
        bubble.innerHTML = fixHTML(content);
        setTimeout(() => {
          makeLinksClickable(bubble);
          tryBuildChart(bubble, chartMeta);
          addDownloadButtons(bubble);
        }, 200);
      } else {
        bubble.textContent = content;
      }
    }

    const ts = document.createElement("div");
    const now = new Date();
    ts.style.cssText = `font-size:10px;color:#aaa;margin-top:3px;text-align:${role==="user"?"right":"left"};padding:0 4px`;
    ts.textContent = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");

    const col = document.createElement("div");
    col.style.cssText = `display:flex;flex-direction:column;max-width:${type==="html"?"100%":"80%"}`;
    col.appendChild(bubble);
    col.appendChild(ts);

    wrap.appendChild(av);
    wrap.appendChild(col);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = `<div class="avatar bot">M</div><div class="bubble bot typing"><span></span><span></span><span></span></div>`;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }
  function removeTyping() { document.getElementById("typing-indicator")?.remove(); }

  async function sendMessage(overrideText) {
    const input = document.getElementById("msgInput");
    const text = overrideText || input.value.trim();
    if (!text) return;
    addMessage("user", text);
    history.push({ role: "user", content: text });
    if (!overrideText) input.value = "";
    showTyping();

    try {
      const body = { message: text, history, session_id: SESSION_ID };
      if (pendingExactName) { body.exactName = pendingExactName; pendingExactName = null; }
      const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await res.json();
      removeTyping();
      const type = data.type || "text";
      const reply = data.reply || data.message || "";
      const options = data.options || [];
      const chartMeta = data.chartMeta || null;
      addMessage("assistant", reply, type, options, chartMeta);
      if (type !== "suggestions") history.push({ role: "assistant", content: reply });
    } catch(e) {
      removeTyping();
      addMessage("assistant", "Server error. Please try again.", "text");
    }
  }

  function clearChat() {
    fetch("/history/" + SESSION_ID, { method: "DELETE" }).catch(() => {});
    document.getElementById("chat").innerHTML = "";
    history = [];
  }

  document.getElementById("msgInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  (async () => {
    try {
      const res = await fetch("/history/" + SESSION_ID);
      const data = await res.json();
      data.forEach(m => {
        const isHTML = m.content && /<table|<div|<tr|<td|<th/i.test(m.content);
        addMessage(m.role, m.content, isHTML && m.role === "assistant" ? "html" : "text");
        history.push({ role: m.role, content: m.content });
      });
    } catch(e) {}
  })();
</script>
</body>
</html>
