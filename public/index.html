<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIS Work India — Sales Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    #header {
      background: #1a1a2e;
      color: #fff;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #header .brand { display: flex; align-items: center; gap: 10px; }
    #header .logo {
      width: 36px; height: 36px; border-radius: 50%;
      background: #4a90d9; display: flex; align-items: center;
      justify-content: center; font-weight: bold; font-size: 14px;
    }
    #header .title { font-size: 15px; font-weight: 700; }
    #header .subtitle { font-size: 11px; opacity: 0.7; }
    #header .right { display: flex; align-items: center; gap: 14px; }
    #header .online { font-size: 11px; color: #4caf50; }
    #header .online::before { content: "● "; }
    #clearBtn {
      background: none; border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; font-size: 11px;
    }
    #clearBtn:hover { background: rgba(255,255,255,0.1); }

    /* ── CHAT AREA ── */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── BUBBLES ── */
    .bubble-wrap {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .bubble-wrap.user { flex-direction: row-reverse; }

    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; flex-shrink: 0;
      margin-top: 2px;
    }
    .avatar.bot  { background: #1a1a2e; color: #fff; }
    .avatar.user { background: #4a90d9; color: #fff; }

    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }
    .bubble.bot {
      background: #fff;
      color: #222;
      border-top-left-radius: 2px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .bubble.user {
      background: #1a73e8;
      color: #fff;
      border-top-right-radius: 2px;
    }

    /* ── HTML TABLE BUBBLE ── */
    .bubble.html-content {
      max-width: 98%;
      padding: 12px;
      background: #fff;
      overflow-x: auto;
      box-shadow: 0 1px 6px rgba(0,0,0,0.12);
      border-radius: 10px;
    }

    /* ── GLOBAL TABLE STYLES (applied to ALL AI-generated tables) ── */
    .bubble table,
    .bubble.html-content table {
      border-collapse: collapse !important;
      width: 100% !important;
      font-size: 12px !important;
      font-family: Arial, sans-serif !important;
      margin: 6px 0 !important;
    }
    .bubble table th,
    .bubble.html-content table th {
      background: #1a1a2e !important;
      color: #fff !important;
      padding: 9px 12px !important;
      text-align: left !important;
      font-size: 12px !important;
      white-space: nowrap !important;
      border: 1px solid #444 !important;
    }
    .bubble table td,
    .bubble.html-content table td {
      padding: 8px 12px !important;
      border: 1px solid #ddd !important;
      font-size: 12px !important;
      vertical-align: middle !important;
    }
    /* Alternating rows */
    .bubble table tbody tr:nth-child(even),
    .bubble.html-content table tbody tr:nth-child(even) {
      background: #f9f9f9 !important;
    }
    .bubble table tbody tr:nth-child(odd),
    .bubble.html-content table tbody tr:nth-child(odd) {
      background: #fff !important;
    }
    /* Grand total / summary rows */
    .bubble table tr.grand-total td,
    .bubble.html-content table tr.grand-total td,
    .bubble table tfoot tr td,
    .bubble.html-content table tfoot tr td {
      background: #e0e0e0 !important;
      font-weight: bold !important;
    }
    /* Hover effect */
    .bubble table tbody tr:hover,
    .bubble.html-content table tbody tr:hover {
      background: #eef4ff !important;
    }
    /* Amount cells right-align */
    .bubble table td.amt,
    .bubble.html-content table td.amt {
      text-align: right !important;
      font-family: monospace !important;
    }

    /* ── SUGGESTIONS ── */
    .suggestions-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }
    .suggestion-btn {
      padding: 6px 13px;
      border: 1.5px solid #1a73e8;
      background: #fff;
      color: #1a73e8;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .suggestion-btn:hover { background: #1a73e8; color: #fff; }

    /* ── TYPING INDICATOR ── */
    .typing { display: flex; align-items: center; gap: 4px; padding: 10px 13px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #999;
      display: inline-block; animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* ── INPUT BAR ── */
    #inputBar {
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    #msgInput {
      flex: 1;
      padding: 9px 14px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    #msgInput:focus { border-color: #1a73e8; }
    #sendBtn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #1a73e8; border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s;
    }
    #sendBtn:hover { background: #1558b0; }
    #sendBtn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="title">MIS Work India</div>
      <div class="subtitle">Sales Assistant</div>
    </div>
  </div>
  <div class="right">
    <button id="clearBtn" onclick="clearChat()">Clear chat</button>
    <span class="online">Online</span>
  </div>
</div>

<!-- CHAT -->
<div id="chat"></div>

<!-- INPUT -->
<div id="inputBar">
  <input id="msgInput" type="text" placeholder="Ask about invoices, ledger, payments, expenses..." />
  <button id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  // ── SESSION ──────────────────────────────────────────────────────────────────
  let SESSION_ID = localStorage.getItem("mis_session_id");
  if (!SESSION_ID) {
    SESSION_ID = "s_" + Math.random().toString(36).slice(2);
    localStorage.setItem("mis_session_id", SESSION_ID);
  }
  let history = [];
  let pendingExactName = null;

  // ── POST-PROCESS HTML: fix tables coming from AI ─────────────────────────────
  function fixTableHTML(html) {
    // 1. Remove undefined / null text
    html = html.replace(/\bundefined\b/gi, "-");
    html = html.replace(/\bnull\b/gi, "-");
    html = html.replace(/\bEMPTY\b/g, "-");

    // 2. Ensure Grand Total row has bold + highlight class
    html = html.replace(
      /<tr[^>]*>\s*<td[^>]*>\s*(?:Grand\s*Total|GRAND\s*TOTAL|Total)[^<]*<\/td>/gi,
      (match) => {
        if (!match.includes('class=')) {
          return match.replace('<tr', '<tr class="grand-total"');
        }
        return match;
      }
    );

    // 3. Fix date format: 2025-04-15 → 15-Apr-25, 2025-04 → Apr-25
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    // Full date: 2025-04-15
    html = html.replace(/\b(20\d{2})-(0[1-9]|1[0-2])-(\d{2})\b/g, (_, y, m, d) => {
      return d + "-" + MONTHS[parseInt(m)-1] + "-" + y.slice(2);
    });
    // Month only: 2025-04
    html = html.replace(/\b(20\d{2})-(0[1-9]|1[0-2])\b/g, (_, y, m) => {
      return MONTHS[parseInt(m)-1] + "-" + y.slice(2);
    });

    // 4. Remove blank <br> at top/bottom
    html = html.replace(/^(\s*<br\s*\/?>\s*)+/gi, "").replace(/(\s*<br\s*\/?>\s*)+$/gi, "").trim();

    return html;
  }

  // ── RENDER MESSAGE ───────────────────────────────────────────────────────────
  function addMessage(role, content, type = "text", options = []) {
    const chat = document.getElementById("chat");

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap " + (role === "user" ? "user" : "bot");

    const av = document.createElement("div");
    av.className = "avatar " + (role === "user" ? "user" : "bot");
    av.textContent = role === "user" ? "U" : "M";

    const bubble = document.createElement("div");

    if (type === "html") {
      bubble.className = "bubble html-content";
      bubble.innerHTML = fixTableHTML(content);

    } else if (type === "suggestions") {
      bubble.className = "bubble bot";
      bubble.innerHTML = `<div style="margin-bottom:6px;font-weight:500">${content}</div>`;
      const sw = document.createElement("div");
      sw.className = "suggestions-wrap";
      (options || []).forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "suggestion-btn";
        btn.textContent = opt;
        btn.onclick = () => {
          // If it looks like a company name (for ledger), set exactName
          const isSystemOption = ["Show all sales data","Show all expenses","Show pending payments","Show ledger"].includes(opt);
          if (isSystemOption) {
            sendMessage(opt);
          } else {
            // Check if last user message was about invoice/bill
            const lastUserMsg = [...document.querySelectorAll('.bubble.user')].pop();
            const isInvoice = lastUserMsg && /invoice|bill/i.test(lastUserMsg.textContent);
            if (isInvoice) {
              sendMessage("give me invoice of " + opt);
            } else {
              pendingExactName = opt;
              sendMessage(opt + " ledger");
            }
          }
        };
        sw.appendChild(btn);
      });
      bubble.appendChild(sw);

    } else {
      bubble.className = "bubble " + (role === "user" ? "user" : "bot");
      const hasHTML = /<table|<div|<tr|<td|<th/i.test(content);
      if (hasHTML && role === "assistant") {
        bubble.innerHTML = fixTableHTML(content);
      } else {
        bubble.textContent = content;
      }
    }

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  // ── TYPING ───────────────────────────────────────────────────────────────────
  function showTyping() {
    const chat = document.getElementById("chat");
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap bot";
    wrap.id = "typing-indicator";
    wrap.innerHTML = `
      <div class="avatar bot">M</div>
      <div class="bubble bot typing"><span></span><span></span><span></span></div>
    `;
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  // ── SEND MESSAGE ─────────────────────────────────────────────────────────────
  async function sendMessage(overrideText) {
    const input = document.getElementById("msgInput");
    const text = overrideText || input.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    if (!overrideText) input.value = "";

    showTyping();

    try {
      const body = { message: text, history, session_id: SESSION_ID };
      if (pendingExactName) { body.exactName = pendingExactName; pendingExactName = null; }

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      removeTyping();

      const type    = data.type || "text";
      const reply   = data.reply || data.message || "";
      const options = data.options || [];

      addMessage("assistant", reply, type, options);
      if (type !== "suggestions") {
        history.push({ role: "assistant", content: reply });
      }
    } catch(e) {
      removeTyping();
      addMessage("assistant", "Server error. Please try again.", "text");
    }
  }

  // ── CLEAR ────────────────────────────────────────────────────────────────────
  function clearChat() {
    document.getElementById("chat").innerHTML = "";
    history = [];
  }

  // ── ENTER KEY ────────────────────────────────────────────────────────────────
  document.getElementById("msgInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── LOAD HISTORY ON PAGE OPEN ─────────────────────────────────────────────────
  (async () => {
    try {
      const res = await fetch("/history/" + SESSION_ID);
      const data = await res.json();
      data.forEach(m => {
        const isHTML = m.content && /<table|<div|<tr|<td|<th/i.test(m.content);
        addMessage(m.role, m.content, isHTML && m.role === "assistant" ? "html" : "text");
        history.push({ role: m.role, content: m.content });
      });
    } catch(e) {}
  })();
</script>
</body>
</html>
